services:
  postgres:
    image: postgres:16-alpine
    container_name: comp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comp
      POSTGRES_PASSWORD: comp
      POSTGRES_DB: compensation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comp -d compensation"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Browser GUI. Opt-in so it doesn't start with the normal stack:
  #   docker compose --profile tools up -d
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: comp-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
